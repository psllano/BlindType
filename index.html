<!doctype html>
<html lang="en">
<head>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BlindType">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BlindType</title>
  <style>
    :root{--bg:#0f1724;--panel:#0b1220;--text:#e6eef8;--muted:#9fb0c8}
    html,body{height:100%;margin:0;font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;background:var(--bg);color:var(--text)}
    .app{height:100vh;display:flex;flex-direction:column}
    header{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.03);display:flex;gap:12px;align-items:center;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent)}
    header h1{font-size:16px;margin:0;font-weight:600}
    .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
    .btn{background:#0b1220;border:1px solid rgba(255,255,255,0.04);padding:8px 10px;border-radius:8px;color:var(--text);cursor:pointer}
    .btn.ghost{background:transparent}

    .stage{flex:1;display:flex;justify-content:center;align-items:center;gap:24px}

    /* .paper{width:100%;height:90%;display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0d1622 0%, #061018 100%);border-radius:10px;padding:26px;box-shadow:0 6px 30px rgba(2,6,23,0.6);overflow:hidden;position:relative} */

    .page{width:95vh;height:100%;background:linear-gradient(180deg,#fbfcff 0%, #f7fafc 100%);border-radius:6px;padding:80px;box-sizing:border-box;color:#0b1220;position:relative;overflow:hidden}
    .lines{height:100%;display:flex;flex-direction:column;gap:6px}
    .line{font-size:18px;line-height:1.35em;white-space:pre-wrap;word-break:break-word;opacity:1;transition:opacity 600ms ease, transform 600ms ease}
    .line.dim{opacity:0.22;transform:translateY(-6px)}
    .line.hidden{opacity:0;transform:translateY(-10px)}

     /* committed lines (bufferBefore) should be fully justified */
     .line.committed{ text-align: justify; text-justify: inter-word }
     .line.committedShort{ text-align: left; text-justify: auto }
     /* Force justification even for single-line blocks by appending an inline-block
       pseudo-element that stretches to the full width. This makes inter-word
       spacing expand so left and right edges align. */
    .line.committed::after{ content: ''; display: inline-block; width: 100%; height: 0; font-size: 0; line-height: 0; vertical-align: bottom }
    .line.committedShort::after{ content: ''; display: inline-block; width: 100%; height: 0; font-size: 0; line-height: 0; vertical-align: bottom }

    /* prevent the current (active) line from animating when it updates */
    .line.current{transition: none; transform: none}

    #cursor {
      display: inline-block;
      width: 1px;
      height: 1.35em;
      background: #0b1220; /* or white if you’re in dark mode */
      margin-left: 1px;
      animation: blink 1s steps(1) infinite;
      vertical-align: bottom;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }


    .status{display:flex;gap:8px;align-items:left;color:var(--muted);font-size:13px}

    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input[type=number], input[type=date], select{width:100%;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text)}
    .small{font-size:13px;color:var(--muted)}

    /* hidden textarea used for capturing typing */
    textarea#capture{position:absolute;left:-9999px;top:-9999px;opacity:0}

    footer{padding:10px 18px;border-top:1px solid rgba(255,255,255,0.03);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}

    .read-view{white-space:pre-wrap;font-size:15px;line-height:1.5;}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="status" id="status">Not started</div>
      <div class="controls">
        <div class="small">Title</div>
        <textarea id="title"></textarea>

        <div class="small">Unlock date</div>
        <input id="unlockDate" type="date" style="width:84px"/>

        <div class="small">Visible lines</div>
        <select id="visibleLines" style="width:84px">
          <option>3</option>
          <option selected>5</option>
          <option>7</option>
          <option>9</option>
        </select>

        <div class="small">Duration (min)</div>
        <input id="duration" type="number" min="1" value="15" style="width:76px" />

        <button id="startBtn" class="btn">Start</button>
        <button id="stopBtn" class="btn ghost" style="display:none">Stop</button>
        <button id="saveBtn" class="btn">Save now</button>
        <button id="unlockBtn" class="btn">Unlock now</button>
          <input id="fileInput" type="file" accept=".blind,application/json" style="display:none" />

      </div>
    </header>
    <div class="stage">
      <!-- <div class="paper"> -->
        <div class="page" id="page">
          <div class="lines" id="lines"></div>
        </div>
        <textarea id="capture" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <!-- </div> -->
    </div>

<script>
// BlindType: simple vanishing editor
const title = document.getElementById('title');
const capture = document.getElementById('capture');
const linesEl = document.getElementById('lines');
const status = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const durationInput = document.getElementById('duration');
const visibleLinesSelect = document.getElementById('visibleLines');
const unlockDateInput = document.getElementById('unlockDate');
const saveBtn = document.getElementById('saveBtn');
const MAX_LINE_CHARS = 48
// minimum characters in a committed line before we apply full justification
const MIN_JUSTIFY_CHARS = 48;

let running=false;
let bufferBefore = ''; // committed text (all previous lines)
let currentLine = '';
let timer = null;
let endTime=null;
let visibleLines = parseInt(visibleLinesSelect.value,10);

// used to avoid double-rendering when input + keyup both fire
let skipNextKeyupRender = false;

visibleLinesSelect.addEventListener('change',()=>{visibleLines=parseInt(visibleLinesSelect.value,10); renderLines();});

// keep capture focused
document.getElementById('page').addEventListener('mousedown',(e)=>{capture.focus(); e.preventDefault();});
// also focus when user clicks anywhere
document.addEventListener('click',()=>{if(running) capture.focus();});

function startSession(){
  bufferBefore = '';
  currentLine = '';
  running=true;
  startBtn.style.display='none';
  stopBtn.style.display='inline-block';
  capture.value='';
  capture.focus();
  const minutes = Math.max(1, parseInt(durationInput.value,10)||15);
  endTime = Date.now() + minutes*60000;
  status.textContent = `Running — ${minutes} min`; 
  timer = setInterval(()=>{
    const rem = Math.max(0, Math.floor((endTime - Date.now())/1000));
    const m = Math.floor(rem/60), s = rem%60;
    status.textContent = `Running — ${m}:${String(s).padStart(2,'0')}`;
    if(Date.now()>=endTime){stopSession(true);}
  }, 250);
  renderLines();
}

function stopSession(autosave=false){
  running=false;
  startBtn.style.display='inline-block';
  stopBtn.style.display='none';
  clearInterval(timer);
  status.textContent = 'Stopped';
  // commit currentLine
  bufferBefore += currentLine;
  if(!bufferBefore.endsWith('\n')) bufferBefore+='\n';
  currentLine='';
  capture.value='';
  renderLines();
  if(autosave){
    saveLockedFile();
  }
}


startBtn.addEventListener('click',startSession);
stopBtn.addEventListener('click',()=>stopSession(false));
// Use 'keyup' so the caret/selection has been updated by the browser
// before we read `capture.selectionStart`. Listening on 'keydown' reads
// the position too early (before the default action), causing the
// cursor to appear to lag one keypress behind.
capture.addEventListener('keyup', updateDisplay);
capture.addEventListener('click', updateDisplay);

function updateDisplay() {
  if (skipNextKeyupRender) { skipNextKeyupRender = false; return; }
  currentLine = capture.value;
  const cursorPos = capture.selectionStart;
  renderLines(cursorPos);
}


// keep caret at end of currentLine; only allow editing currentLine
capture.addEventListener('input',(e)=>{
  if(!running) return;
  // sync currentLine with textarea value
  currentLine = capture.value.replace(/\r/g,'');
  // Don't render immediately here (keyup also fires). Instead render once in RAF
  // with the correct caret position and set a flag so the subsequent keyup
  // handler skips one render to avoid flicker.
  requestAnimationFrame(()=>{
    const pos = capture.selectionStart;
    // ensure caret at end only when the browser already left the caret at the end.
    if (pos === capture.value.length) {
      capture.selectionStart = capture.selectionEnd = capture.value.length;
    }
    skipNextKeyupRender = true;
    renderLines(pos);
  });
});

capture.addEventListener('keydown',(e)=>{
  if(!running) return;
  // prevent arrow keys from moving selection to previous lines
  if(['ArrowUp','ArrowLeft','Home','PageUp'].includes(e.key)){
    // allow within current line only; if at pos 0, prevent
    if(capture.selectionStart === 0){ e.preventDefault(); }
  } 
  // prevent backspace deleting previous content
  if(e.key === 'Backspace'){
    if(capture.selectionStart === 0){
      // at start of current line, block deletion into bufferBefore
      e.preventDefault();
    }
  }
  // handle auto commits
  if(e.key === ' ' && currentLine.length >= MAX_LINE_CHARS){
    e.preventDefault();
    bufferBefore += currentLine+ ' \n';
    currentLine = '';
    capture.value = '';
    renderLines();
  }
  // Enter: commit current line and start a fresh one (we allow newline but do not require submit)
  if(e.key === 'Enter'){
    e.preventDefault();
    bufferBefore += currentLine + '\n';
    currentLine = '';
    capture.value = '';
    renderLines();
  }
});

function renderLines(cursorPos = currentLine.length) {
  if(!running) return;
  let allLines = [];
  if (bufferBefore)
    allLines = bufferBefore
      .split('\n')
      .filter((l, i, arr) => !(i === arr.length - 1 && l === ''));
  
  allLines.push(currentLine);
  const tail = allLines.slice(-visibleLines);
  linesEl.innerHTML = '';

  tail.forEach((ln, idx) => {
    const div = document.createElement('div');
    div.className = 'line';
    // mark committed lines (all except the current editing line)
    // only justify if the line is long enough and contains at least one space
    if (idx !== tail.length - 1 && ln && ln.trim().length >= MIN_JUSTIFY_CHARS && ln.includes(' ')) {
      div.classList.add('committed');
    } else if (idx !== tail.length - 1) {
      div.classList.add('committedShort');
    }
    if (idx < Math.max(0, tail.length - 2)) div.classList.add('dim');

    if (idx === tail.length - 1) {
      div.classList.add('current');
      const beforeCursor = ln.slice(0, cursorPos);
      const afterCursor = ln.slice(cursorPos);

      // Build the DOM nodes directly (avoid innerHTML to reduce reflow/parsing and
      // to prevent restarting animations/transitions on sibling elements).
      if (beforeCursor) div.appendChild(document.createTextNode(beforeCursor));
      const cursorSpan = document.createElement('span');
      cursorSpan.id = 'cursor';
      div.appendChild(cursorSpan);
      // If there's no content after cursor, append a non-breaking space so the line keeps height
      div.appendChild(document.createTextNode(afterCursor || '\u00A0'));
    } else {
      div.textContent = ln || '\u00A0';
    }

    linesEl.appendChild(div);
  });
}



// Save: create a small JSON "locked" file that contains unlock_date and base64 content
function saveLockedFile(){
  const unlock = unlockDateInput.value;
  if(!unlock){
    alert('Please set an unlock date before saving.');
    return;
  }

  let full = (bufferBefore + currentLine)
    .replace(/ \n+/g, ' ')
    .replace(/\n+$/, '');
  full += '\n';

  const payload = {
    version: 1,
    title: title.value || 'Untitled',
    created: new Date().toISOString(),
    unlock_date: unlock,
    content_b64: btoa(unescape(encodeURIComponent(full)))
  };

  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const name = `blindtype_${new Date().toISOString().replace(/[:.]/g,'-')}.blind`;
  const url = URL.createObjectURL(blob);

  // Safari-safe method: create a temporary visible link and require user click
  const link = document.createElement('a');
  link.href = url;
  link.download = name;
  link.style.display = 'none';

  link.click();
}

saveBtn.addEventListener('click',saveLockedFile);

// Unlock: read a .blind file, check unlock date, and if passed, decode and offer download
const readBtn = document.getElementById('unlockBtn');
const fileInput = document.getElementById('fileInput');

readBtn.addEventListener('click', () => {
  fileInput.value = '';
  fileInput.click();
});

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    const payload = JSON.parse(text);

    // Validaciones básicas
    if (!payload.unlock_date || !payload.content_b64) {
      alert('Invalid .blind file');
      return;
    }

    const today = new Date();
    const unlockDate = new Date(payload.unlock_date + 'T00:00:00');

    if (today < unlockDate) {
      alert(`This file is locked until ${payload.unlock_date}`);
      return;
    }

    // Decodificar contenido
    const decoded = decodeURIComponent(
      escape(atob(payload.content_b64))
    );

    downloadTxt(decoded, payload.title || 'blindtype');

  } catch (err) {
    console.error(err);
    alert('Error reading file');
  }
});

function downloadTxt(content, title) {
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const safeTitle = title
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_|_$/g, '');

  const link = document.createElement('a');
  link.href = url;
  link.download = `${safeTitle || 'blindtype'}.txt`;
  link.click();

  URL.revokeObjectURL(url);
}


// ensure the invisible capture is focused on load
window.addEventListener('load',()=>{capture.focus();});
</script>
</body>
</html>
